<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { overflow:hidden; }
  body { font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif; }

  body { width:1080px; height:1440px; background:linear-gradient(170deg,#1a2130,#0e131c); color:#fff;
         padding:130px 100px; position:relative; overflow:hidden; display:flex; flex-direction:column; }
  .g { position:absolute; width:760px; height:760px; border-radius:50%; right:-260px; bottom:-240px;
       background:radial-gradient(circle,rgba(198,168,98,.25),transparent 70%); }
  .badge { display:inline-block; font-size:26px; letter-spacing:6px; color:#0e131c; background:#e8c86a;
           padding:14px 26px; border-radius:6px; font-weight:700; align-self:flex-start; }
  h1 { margin-top:70px; font-size:96px; line-height:1.28; font-weight:800; letter-spacing:2px; }
  h1 em { font-style:normal; color:#e8c86a; }
  .quote { margin-top:78px; font-size:36px; line-height:1.75; color:#b9c4d4; border-left:6px solid #e8c86a; padding-left:34px; }
  .foot { margin-top:auto; font-size:27px; color:#6f7b8d; letter-spacing:3px; }
</style></head><body>
  <div class="g"></div>
  <div class="badge">过 程 记 录</div>
  <h1>我让 AI 给我<br>算了一卦<br>它先让我<em>验证</em><br>了 6 件事</h1>
  <div class="quote">对不上的比对上多，<br>它说：这单不收钱。</div>
  <div class="foot">传统文化咨询 · 娱乐参考</div>
</body></html>
