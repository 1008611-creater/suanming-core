<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { overflow:hidden; }
  body { font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif; }

  body { width:800px; height:800px; background:#f7f4ee; color:#22201c; padding:64px 60px; position:relative; overflow:hidden; }
  .band { position:absolute; top:0; left:0; width:100%; height:14px; background:#b03a2e; }
  .kicker { font-size:22px; letter-spacing:6px; color:#b03a2e; margin:26px 0 30px; }
  h1 { font-size:82px; line-height:1.22; font-weight:800; letter-spacing:2px; }
  .list { margin-top:44px; }
  .row { display:flex; align-items:center; font-size:30px; padding:18px 0; border-bottom:2px solid #e2dcd1; }
  .row .k { flex:1; color:#3a3630; }
  .ok { color:#1f7a4d; font-weight:700; font-size:26px; }
  .no { color:#b03a2e; font-weight:700; font-size:26px; }
  .foot { position:absolute; bottom:50px; left:60px; font-size:22px; color:#8b857a; letter-spacing:2px; }
</style></head><body>
  <div class="band"></div>
  <div class="kicker">这 份 报 告 的 第 一 页</div>
  <h1>判错的，<br>我也写出来</h1>
  <div class="list">
    <div class="row"><span class="k">学历判断</span><span class="ok">✓ 对</span></div>
    <div class="row"><span class="k">父母关系</span><span class="ok">✓ 对，但说轻了</span></div>
    <div class="row"><span class="k">感情节点</span><span class="no">✗ 错，已认账</span></div>
  </div>
  <div class="foot">附错因分析 · 传统文化咨询</div>
</body></html>
