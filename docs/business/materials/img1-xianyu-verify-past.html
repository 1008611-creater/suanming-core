<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { overflow:hidden; }
  body { font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif; }

  body { width:800px; height:800px; background:linear-gradient(160deg,#10151f 0%,#1c2433 55%,#0d1119 100%);
         color:#fff; display:flex; flex-direction:column; justify-content:center; padding:70px 64px; position:relative; overflow:hidden; }
  .glow { position:absolute; width:520px; height:520px; border-radius:50%; right:-180px; top:-160px;
          background:radial-gradient(circle,rgba(198,168,98,.28),transparent 70%); }
  .glow2 { position:absolute; width:420px; height:420px; border-radius:50%; left:-160px; bottom:-140px;
          background:radial-gradient(circle,rgba(120,170,220,.20),transparent 70%); }
  .tag { font-size:22px; letter-spacing:8px; color:#c6a862; margin-bottom:34px; }
  h1 { font-size:104px; line-height:1.16; font-weight:800; letter-spacing:4px; }
  h1 .hl { color:#e8c86a; }
  .sub { margin-top:40px; font-size:34px; color:#cfd8e3; letter-spacing:3px; font-weight:300; }
  .line { width:110px; height:5px; background:#c6a862; margin:38px 0 30px; }
  .foot { position:absolute; bottom:52px; left:64px; font-size:21px; color:#7f8b9c; letter-spacing:2px; }
</style></head><body>
  <div class="glow"></div><div class="glow2"></div>
  <div class="tag">传 统 文 化 咨 询</div>
  <h1>先验前事<br><span class="hl">验不准不要钱</span></h1>
  <div class="line"></div>
  <div class="sub">先说几件已发生的事 · 你打分</div>
  <div class="foot">命理结构分析 · 娱乐参考</div>
</body></html>
