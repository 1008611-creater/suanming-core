name: rebuild-tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild directory layout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs docs/decisions examples scripts src src/astro src/calendar src/charts/bazi src/derive src/interpret src/schema src/time tests
          git mv "api.md" "docs/api.md"
          git mv "architecture.md" "docs/architecture.md"
          git mv "astro-model.md" "docs/astro-model.md"
          git mv "bazi-luck.md" "docs/bazi-luck.md"
          git mv "compliance.md" "docs/compliance.md"
          git mv "ADR-0001-vsop87-reference-frame.md" "docs/decisions/ADR-0001-vsop87-reference-frame.md"
          git mv "ADR-0003-jie-zhongqi.md" "docs/decisions/ADR-0003-jie-zhongqi.md"
          git mv "validation.md" "docs/validation.md"
          git mv "basic.mjs" "examples/basic.mjs"
          git mv "check.js" "scripts/check.js"
          git mv "delta-t.js" "src/astro/delta-t.js"
          git mv "equation-of-time.js" "src/astro/equation-of-time.js"
          git mv "moon.js" "src/astro/moon.js"
          git mv "nutation.js" "src/astro/nutation.js"
          git mv "solar-terms.js" "src/astro/solar-terms.js"
          git mv "sun.js" "src/astro/sun.js"
          git mv "vsop87.js" "src/astro/vsop87.js"
          git mv "lunar.js" "src/calendar/lunar.js"
          git mv "chart.js" "src/charts/bazi/chart.js"
          git mv "luck.js" "src/charts/bazi/luck.js"
          git mv "pillars.js" "src/charts/bazi/pillars.js"
          git mv "facts.js" "src/derive/facts.js"
          git mv "explain.js" "src/interpret/explain.js"
          git mv "manifest.js" "src/manifest.js"
          git mv "chart.schema.json" "src/schema/chart.schema.json"
          git mv "validate.js" "src/schema/validate.js"
          git mv "julian.js" "src/time/julian.js"
          git mv "shichen.js" "src/time/shichen.js"
          git mv "timezone.js" "src/time/timezone.js"
          git mv "basic.test.js" "tests/basic.test.js"
          git mv "chart-smoke.js" "tests/chart-smoke.js"
          git mv "facts-smoke.js" "tests/facts-smoke.js"
          git mv "lichun-boundary-smoke.js" "tests/lichun-boundary-smoke.js"
          git mv "luck-age-smoke.js" "tests/luck-age-smoke.js"
          git mv "luck-smoke.js" "tests/luck-smoke.js"
          git mv "lunar-months-smoke.js" "tests/lunar-months-smoke.js"
          git mv "lunar-number-smoke.js" "tests/lunar-number-smoke.js"
          git mv "lunar-smoke.js" "tests/lunar-smoke.js"
          git mv "schema-smoke.js" "tests/schema-smoke.js"
          git mv "term-boundary-smoke.js" "tests/term-boundary-smoke.js"
          git mv "zhongqi-smoke.js" "tests/zhongqi-smoke.js"
          git rm -q "index.js"
          git rm -q "ci.yml"
          cat > src/index.js <<'EOF'
          export * from './astro/index.js';
          export * from './time/julian.js';
          export * from './time/timezone.js';
          export * from './time/shichen.js';
          export * from './derive/facts.js';
          export * from './interpret/explain.js';
          export * from './charts/bazi/index.js';
          export * from './manifest.js';
          export * from './calendar/lunar.js';
          export * from './schema/validate.js';
          EOF
          cat > src/astro/index.js <<'EOF'
          export * from './sun.js';
          export * from './solar-terms.js';
          export * from './moon.js';
          export * from './delta-t.js';
          EOF
          cat > src/charts/bazi/index.js <<'EOF'
          export * from './pillars.js';
          export * from './chart.js';
          export * from './luck.js';
          EOF
          git add -A
          git status --short
          git commit -m "chore: 重建目录结构，修复网页上传导致的路径摊平"
          git push origin HEAD:main
