name: sync-payload

on:
  push:
    paths:
      - 'payload.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[skip-sync]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Decode payload
        run: |
          node -e "const fs=require('fs'),zlib=require('zlib');const p=JSON.parse(zlib.gunzipSync(Buffer.from(fs.readFileSync('payload.b64','utf8').trim(),'base64')).toString('utf8'));let n=0;for(const [rel,b64] of Object.entries(p)){if(rel.startsWith('.github/workflows/'))continue;const dir=rel.split('/').slice(0,-1).join('/');if(dir)fs.mkdirSync(dir,{recursive:true});fs.writeFileSync(rel,Buffer.from(b64,'base64'));n++;}console.log('wrote '+n+' files');"
      - name: Run checks
        run: npm test
      - name: Commit and remove this workflow
        run: |
          git config user.name "1008611-creater"
          git config user.email "liushubin1008611@gmail.com"
          rm -f payload.b64
          rm -f .github/workflows/sync.yml
          git add -A
          git commit -m "feat: ziwei minor stars and twelve gods (v0.5.0) [skip-sync]"
          git push
